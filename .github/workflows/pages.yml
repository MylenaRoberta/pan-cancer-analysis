
name: Deploy quadripartite network viewer

on:
  push:
    branches:
      - main
      - feature/quadripartite-network
    tags:
      - 'v[0-9]*'
    paths:
      - "docs/quadripartite-network-visualizer/graph_viewer.html"
      - "docs/quadripartite-network-visualizer/data/*_nodes.csv"
      - "docs/quadripartite-network-visualizer/data/*_edges.csv"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare current and versioned sites
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="docs/quadripartite-network-visualizer"
          mkdir -p _site

          # Preserve normal branch deployment behavior
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            ROOT_REF="origin/main"
          else
            ROOT_REF="HEAD"
          fi

          # Publish the current viewer
          git archive "${ROOT_REF}:${SOURCE_DIR}" | tar -xf - -C _site
          mv _site/graph_viewer.html _site/index.html

          # Publish the viewer associated with each version tag
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

            if ! git cat-file -e "${tag}:${SOURCE_DIR}/graph_viewer.html" 2>/dev/null || \
               ! git cat-file -e "${tag}:${SOURCE_DIR}/data" 2>/dev/null; then
              echo "Skipping ${tag}: missing viewer or data directory"
              continue
            fi

            mkdir -p "_site/${tag}"

            git archive "${tag}:${SOURCE_DIR}" |
              tar -xf - -C "_site/${tag}"

            mv "_site/${tag}/graph_viewer.html" \
               "_site/${tag}/index.html"

            echo "Published archived viewer: /${tag}/"
          done < <(git tag --list 'v*')

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
