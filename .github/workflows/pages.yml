name: Deploy quadripartite network viewer

on:
  push:
    branches:
      - main
      - feature/quadripartite-network
    paths:
      - "external/quadripartite-network-visualizer/graph_viewer.html"
      - "external/quadripartite-network-visualizer/data/*_nodes.csv"
      - "external/quadripartite-network-visualizer/data/*_edges.csv"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/data

          cp external/quadripartite-network-visualizer/graph_viewer.html _site/index.html
          cp external/quadripartite-network-visualizer/data/*_nodes.csv _site/data/
          cp external/quadripartite-network-visualizer/data/*_edges.csv _site/data/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
